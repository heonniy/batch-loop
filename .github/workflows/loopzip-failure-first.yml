name: LoopZip Failure-first CPU gates

on:
  push:
    branches:
      - research/loopzip-attention-failure-first-20261031
    paths:
      - "kv_policy/kvp/loopzip_policy.py"
      - "kv_policy/kvp/loopzip_cached_eval.py"
      - "kv_policy/scripts/loopzip_failure_screen.py"
      - "kv_policy/scripts/loopzip_observations.py"
      - "kv_policy/tests/test_loopzip_*.py"
      - ".github/workflows/loopzip-failure-first.yml"
  workflow_dispatch:

jobs:
  cpu-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile entire new failure-first implementation
        run: |
          python -m py_compile kv_policy/kvp/loopzip_policy.py \
            kv_policy/kvp/loopzip_cached_eval.py \
            kv_policy/scripts/loopzip_failure_screen.py \
            kv_policy/scripts/loopzip_observations.py \
            kv_policy/tests/test_loopzip_policy.py \
            kv_policy/tests/test_loopzip_cached_eval.py \
            kv_policy/tests/test_loopzip_failure_runner.py \
            kv_policy/tests/test_loopzip_observations.py
      - name: Pure CPU policy and manifest regression
        working-directory: kv_policy
        run: python -m pytest -q tests/test_loopzip_policy.py tests/test_loopzip_failure_runner.py tests/test_loopzip_observations.py


  cpu-torch-probe:
    needs: cpu-gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch and tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Check cached full-prefill and multi-key attention masking
        working-directory: kv_policy
        run: python -m pytest -q tests/test_loopzip_cached_eval.py
